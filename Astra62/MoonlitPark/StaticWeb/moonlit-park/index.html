<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1224">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./viewer.css">
  <title></title>
  <script defer src="./assets/three-viewer.min.js"></script>
  <script defer src="./viewer.js"></script>
</head>
<body>
  <header>
    <h1 data-string="park.title"></h1>
    <a class="download" href="./assets/moonlit-park.glb" download="moonlit-park.glb">
      <span class="download-icon" aria-hidden="true">↓</span><span data-string="park.download"></span>
    </a>
  </header>
  <main id="stage">
    <img id="poster" src="./assets/park-preview.webp" alt="" data-alt="park.title" draggable="false">
    <canvas id="scene" tabindex="0" data-aria="park.scene"></canvas>
    <div class="notice" id="notice">
      <span id="status" role="status" aria-live="polite"></span>
      <button id="open-model" type="button" data-string="park.open" hidden></button>
      <input id="model-file" type="file" accept=".glb,model/gltf-binary" hidden>
    </div>
  </main>
  <footer>
    <p id="gesture"><span class="pointer-hint" data-string="park.gesture"></span><span class="touch-hint" data-string="park.touch"></span></p>
    <div class="controls" role="group" data-aria="park.controls">
      <button type="button" id="zoom-out" data-aria="park.out" disabled><span aria-hidden="true">−</span></button>
      <button type="button" id="zoom-in" data-aria="park.in" disabled><span aria-hidden="true">+</span></button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" id="home" data-aria="park.home" disabled><span aria-hidden="true">↺</span></button>
    </div>
  </footer>
  <!-- This standalone table uses the project's string_key and language columns. -->
  <script id="strings" type="text/csv">
